<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dla Kochanej Wiktorii</title>
  <meta name="description" content="Obracający się bukiet kwiatów 3D stworzony z kodu — Dla Kochanej Wiktorii." />
  <meta property="og:title" content="Dla Kochanej Wiktorii 🌸" />
  <meta property="og:description" content="Interaktywny, obracający się bukiet kwiatów 3D w ASCII." />
  <meta name="theme-color" content="#04050c" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070812'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='36'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E"
  />
  <style>
    :root {
      --bg-top: #03040a;
      --bg-mid: #080915;
      --bg-bot: #0e0713;
      --ui-text: rgba(255, 224, 238, 0.78);
      --ui-border: rgba(255, 182, 213, 0.22);
      --ui-bg: rgba(14, 12, 24, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 56% 48% at 50% 42%, rgba(86, 22, 66, 0.24) 0%, rgba(18, 18, 48, 0.14) 50%, transparent 78%),
        radial-gradient(ellipse 40% 26% at 50% 84%, rgba(128, 36, 78, 0.15) 0%, transparent 72%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 56%, var(--bg-bot) 100%);
      color: #fff;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #stage.dragging {
      cursor: grabbing;
    }

    .controls {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      opacity: 0.48;
      transition: opacity 0.35s ease;
    }

    .controls:hover,
    .controls:focus-within {
      opacity: 1;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      color: var(--ui-text);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
    }

    .btn:hover {
      background: rgba(255, 130, 184, 0.22);
      border-color: rgba(255, 186, 218, 0.52);
      color: #fff5fa;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .hint {
      position: fixed;
      left: 16px;
      bottom: 18px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 214, 232, 0.35);
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    @media (max-width: 680px) {
      .controls {
        right: 10px;
        bottom: 10px;
        opacity: 0.68;
      }
      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Obracający się bukiet kwiatów 3D w ASCII — Dla Kochanej Wiktorii"></canvas>
  <div class="hint" id="hint">przeciągnij, aby obracać w 3D · kliknij dla płatków</div>
  <div class="controls">
    <button class="btn" id="disperseBtn" type="button" title="Rozsyp i złóż ponownie w 3D">✦ pył</button>
    <button class="btn" id="replayBtn" type="button" title="Odtwórz rozkwit od pąka">↻ rozkwitnij</button>
  </div>

  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const DEDICATION = (params.get("msg") || "Dla Kochanej Wiktorii").slice(0, 48);
      const FORCE_TIME = params.has("t") ? parseFloat(params.get("t")) : null;
      const FORCE_YAW = params.has("yaw") ? parseFloat(params.get("yaw")) : null;

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: true });

      const crispCanvas = document.createElement("canvas");
      const crispCtx = crispCanvas.getContext("2d", { alpha: true });
      const glowCanvas = document.createElement("canvas");
      const glowCtx = glowCanvas.getContext("2d", { alpha: true });

      const FONT_STACK = '"JetBrains Mono", "Fira Code", "Cascadia Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace';
      // Aksamitna rampa bez kanciastych znaków (^ ` '), daje gładkie, świecące powierzchnie 3D
      const RAMP = " .,:;-=+*o0%#@";
      const RAMP_MAX = RAMP.length - 1;
      const CELL_RATIO = 0.56;

      // Siatka adaptacyjna: gęsta, holograficzna rozdzielczość (klimat bloom3d.py!)
      let COLS = 152;
      let ROWS = 86;
      let bufChar = [];
      let bufColIdx = new Int32Array(0);
      let bufZ = new Float32Array(0);
      let bufGlow = new Uint8Array(0);

      function allocGrid(cols, rows) {
        COLS = cols;
        ROWS = rows;
        const n = cols * rows;
        bufChar = new Array(n);
        bufColIdx = new Int32Array(n);
        bufZ = new Float32Array(n);
        bufGlow = new Uint8Array(n);
      }

      // Narzędzia matematyczne i PRNG
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(20261128);
      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (e0, e1, x) => {
        const t = clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const easeOutCubic = (x) => {
        const t = clamp(x, 0, 1);
        return 1 - Math.pow(1 - t, 3);
      };
      const easeOutBack = (x) => {
        const t = clamp(x, 0, 1);
        const c1 = 1.25;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      };

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function mixColorStr(c1, c2, t) {
        const u = clamp(t, 0, 1);
        const r = Math.round(c1[0] + (c2[0] - c1[0]) * u);
        const g = Math.round(c1[1] + (c2[1] - c1[1]) * u);
        const b = Math.round(c1[2] + (c2[2] - c1[2]) * u);
        return `rgb(${r},${g},${b})`;
      }

      // Wstępnie wyliczona tablica barw (LUT): bogate, świecące barwy płatków i złota
      const PALETTE_DEFS = {
        crimsonRose: ["#4f0a26", "#9c1646", "#e82e6b", "#ff689b", "#ffc4dc", "#fff7fa"],
        blushPeony:  ["#5e1b44", "#b53676", "#f26ba2", "#ffa8cf", "#ffe0f0", "#ffffff"],
        coralRose:   ["#631824", "#c43542", "#fa6262", "#ff9e82", "#ffd8c4", "#fff8f2"],
        sakura:      ["#632956", "#ba5590", "#f292c0", "#ffc8e3", "#ffebf5", "#ffffff"],
        lavender:    ["#311e70", "#6547c7", "#9b7df2", "#c9b3ff", "#e9dfff", "#fcfaff"],
        cornflower:  ["#193075", "#3465d4", "#669cff", "#a6ccff", "#dcecff", "#f9fbff"],
        sunflower:   ["#6b3008", "#c46210", "#fa9e1e", "#ffd247", "#fff199", "#fffde8"],
        creamPearl:  ["#525a7a", "#929bbd", "#ced6ec", "#f2f4fc", "#ffffff"],
        goldCore:    ["#853a08", "#de7812", "#ffb829", "#ffe878", "#fffbe0"],
        stemGreen:   ["#113824", "#20613e", "#34945a", "#5ec982", "#a8f0ba"],
        leafMint:    ["#174736", "#28785c", "#44b084", "#7ee0b4", "#c7fae0"],
        wrapGold:    ["#473020", "#7d583a", "#b88a5e", "#e8bd90", "#ffebd0"],
        ribbonPink:  ["#78123d", "#cf2565", "#ff4f8e", "#ff94bf", "#ffe0ed"],
      };

      const PAL_STEPS = 32;
      const PAL_NAMES = Object.keys(PALETTE_DEFS);
      const PAL_ID = {};
      const COLOR_LUT = []; // płaska tablica: palId * PAL_STEPS + shadeIdx -> "rgb(r,g,b)"

      PAL_NAMES.forEach((name, idx) => {
        PAL_ID[name] = idx;
        const stops = PALETTE_DEFS[name].map(hexToRgb);
        const n = stops.length - 1;
        for (let s = 0; s < PAL_STEPS; s++) {
          const u = s / (PAL_STEPS - 1);
          const f = u * n;
          const i = Math.min(n - 1, Math.floor(f));
          COLOR_LUT.push(mixColorStr(stops[i], stops[i + 1], f - i));
        }
      });

      // =========================================================================
      // Generator prawdziwej geometrii 3D bukietu (gęsta, gładka siatka bez dziur!)
      // =========================================================================
      const MAX_VERTS = 68000;
      const vBx = new Float32Array(MAX_VERTS); // pozycja w stanie pąka (bud)
      const vBy = new Float32Array(MAX_VERTS);
      const vBz = new Float32Array(MAX_VERTS);
      const vFx = new Float32Array(MAX_VERTS); // pozycja w pełnym rozkwicie (full)
      const vFy = new Float32Array(MAX_VERTS);
      const vFz = new Float32Array(MAX_VERTS);
      const vNx = new Float32Array(MAX_VERTS); // normalna powierzchni 3D
      const vNy = new Float32Array(MAX_VERTS);
      const vNz = new Float32Array(MAX_VERTS);
      const vDx = new Float32Array(MAX_VERTS); // wektor rozproszenia (tryb pyłu 3D)
      const vDy = new Float32Array(MAX_VERTS);
      const vDz = new Float32Array(MAX_VERTS);
      const vBaseShade = new Float32Array(MAX_VERTS); // wrodzony gradient barwy płatka (0=nasada, 1=brzeg)
      const vDelay = new Float32Array(MAX_VERTS); // opóźnienie rozkwitu w sekundach
      const vDur = new Float32Array(MAX_VERTS);   // czas rozkwitu
      const vPal = new Uint8Array(MAX_VERTS);     // indeks palety
      const vGlowFlag = new Uint8Array(MAX_VERTS);
      const vKind = new Uint8Array(MAX_VERTS);    // 0=łodyga/liść/owijka, 1=płatek 3D, 2=rdzeń/gipsówka
      const vCharBias = new Uint8Array(MAX_VERTS); // 0=auto z jasności, >0=wymuszony znak (np. łodygi)

      let vertCount = 0;

      function pushVert(bx, by, bz, fx, fy, fz, nx, ny, nz, palName, baseShade, delay, dur, glow, kind, charBias = 0) {
        if (vertCount >= MAX_VERTS) return;
        const i = vertCount++;
        vBx[i] = bx;
        vBy[i] = by;
        vBz[i] = bz;
        vFx[i] = fx;
        vFy[i] = fy;
        vFz[i] = fz;

        const nl = Math.hypot(nx, ny, nz) || 1;
        vNx[i] = nx / nl;
        vNy[i] = ny / nl;
        vNz[i] = nz / nl;

        // Kierunek dryfu dla efektu rozproszenia w pył (spiralny wiatr w górę i na boki)
        const ang = Math.atan2(fz, fx) + (rand() - 0.5) * 1.4;
        const speed = 2.4 + rand() * 4.8;
        vDx[i] = Math.cos(ang) * speed + (rand() - 0.5) * 1.8;
        vDy[i] = 1.2 + rand() * 3.6 + fy * 0.35;
        vDz[i] = Math.sin(ang) * speed + (rand() - 0.5) * 1.8;

        vBaseShade[i] = baseShade;
        vDelay[i] = delay;
        vDur[i] = dur;
        vPal[i] = PAL_ID[palName];
        vGlowFlag[i] = glow ? 1 : 0;
        vKind[i] = kind;
        vCharBias[i] = charBias;
      }

      // Układ ortonormalny zorientowany wzdłuż osi wzrostu kwiatu (axis = kierunek czubka)
      function makeBasis(ax, ay, az) {
        const al = Math.hypot(ax, ay, az) || 1;
        const ux = ax / al, uy = ay / al, uz = az / al;
        // Wektor pomocniczy nierównoległy do u
        let rx, ry, rz;
        if (Math.abs(uy) < 0.92) {
          rx = uz; ry = 0; rz = -ux;
        } else {
          rx = 1; ry = 0; rz = 0;
        }
        const rl = Math.hypot(rx, ry, rz) || 1;
        rx /= rl; ry /= rl; rz /= rl;
        // b = u x r
        const bx = uy * rz - uz * ry;
        const by = uz * rx - ux * rz;
        const bz = ux * ry - uy * rx;
        return { ux, uy, uz, rx, ry, rz, bx, by, bz };
      }

      // Transformacja z lokalnego układu kwiatu (lx, ly=wzdłuż osi, lz) do świata 3D
      function toWorld(basis, ox, oy, oz, lx, ly, lz) {
        return [
          ox + basis.rx * lx + basis.ux * ly + basis.bx * lz,
          oy + basis.ry * lx + basis.uy * ly + basis.by * lz,
          oz + basis.rz * lx + basis.uz * ly + basis.bz * lz,
        ];
      }

      function dirToWorld(basis, lx, ly, lz) {
        return [
          basis.rx * lx + basis.ux * ly + basis.bx * lz,
          basis.ry * lx + basis.uy * ly + basis.by * lz,
          basis.rz * lx + basis.uz * ly + basis.bz * lz,
        ];
      }

      // 1. Rzeźbiona Róża / Piwonia 3D — gęste spiralne płatki (137.5°), gładkie cieniowanie i pąk!
      function buildRose3D(ox, oy, oz, ax, ay, az, scale, palName, delay, numPetals = 17, nu = 13, nv = 15) {
        const basis = makeBasis(ax, ay, az);
        const GOLDEN = 2.399963229728653;

        // Punkt lokalny na płatku (u in [-1, 1], v in [0, 1]) dla zadanego rozchylenia tilt
        function petalLocal(u, v, phi, len, hw, rBase, tilt, curlAmt) {
          const w = hw * Math.sin(Math.PI * Math.pow(v, 0.62)) * (1.0 - 0.08 * v);
          // Profil łukowaty wzdłuż płatka + wyraźne, rzeźbiarskie podwinięcie końcówki róży
          const arch = tilt * (0.56 + 0.54 * v) + (v > 0.64 ? (v - 0.64) * curlAmt : 0);
          const sLen = len * v;
          const radOut = rBase + sLen * Math.sin(arch) + 0.16 * hw * (1 - u * u) * Math.sin(Math.PI * v);
          const height = sLen * Math.cos(arch) - 0.08 * len * v * v * Math.sin(tilt);
          const tang = u * w;
          const cp = Math.cos(phi);
          const sp = Math.sin(phi);
          return [
            radOut * cp - tang * sp,
            height,
            radOut * sp + tang * cp,
          ];
        }

        for (let p = 0; p < numPetals; p++) {
          const frac = p / Math.max(1, numPetals - 1);
          const phi = p * GOLDEN + rand() * 0.12;
          const len = scale * (0.48 + 0.74 * Math.pow(frac, 0.68));
          const hw = scale * (0.30 + 0.50 * Math.pow(frac, 0.64));
          const rBase = scale * (0.04 + 0.20 * frac);

          const openTilt = 0.20 + 1.08 * Math.pow(frac, 0.78);
          const budTilt = 0.06 + 0.24 * frac;
          const curlAmt = 0.85 + 1.05 * frac;
          const pDelay = delay + frac * 0.62;

          const eps = 0.04;
          for (let iv = 1; iv <= nv; iv++) {
            const v = iv / nv;
            for (let iu = 0; iu < nu; iu++) {
              const u = -1 + (2 * iu) / (nu - 1);

              const fLoc = petalLocal(u, v, phi, len, hw, rBase, openTilt, curlAmt);
              const bLoc = petalLocal(u, v, phi, len * 0.60, hw * 0.54, rBase * 0.45, budTilt, 0.15);

              const fU = petalLocal(u + eps, v, phi, len, hw, rBase, openTilt, curlAmt);
              const fV = petalLocal(u, Math.min(1, v + eps), phi, len, hw, rBase, openTilt, curlAmt);
              const dux = fU[0] - fLoc[0], duy = fU[1] - fLoc[1], duz = fU[2] - fLoc[2];
              const dvx = fV[0] - fLoc[0], dvy = fV[1] - fLoc[1], dvz = fV[2] - fLoc[2];
              const lnx = duy * dvz - duz * dvy;
              const lny = duz * dvx - dux * dvz;
              const lnz = dux * dvy - duy * dvx;

              const wf = toWorld(basis, ox, oy, oz, fLoc[0], fLoc[1], fLoc[2]);
              const wb = toWorld(basis, ox, oy, oz, bLoc[0], bLoc[1], bLoc[2]);
              const wn = dirToWorld(basis, lnx, lny, lnz);

              // Mocny kontrast między głębokim aksamitnym wnętrzem płatka a świecącym jasnym rantem!
              const rimShine = v > 0.78 ? ((v - 0.78) / 0.22) * 0.34 : 0;
              const baseShade = clamp(0.14 + Math.pow(v, 1.45) * 0.58 + rimShine + frac * 0.14, 0.12, 1.0);
              const glow = v > 0.52 || frac > 0.55;

              pushVert(
                wb[0], wb[1], wb[2],
                wf[0], wf[1], wf[2],
                wn[0], wn[1], wn[2],
                palName,
                baseShade,
                pDelay,
                1.35,
                glow,
                1
              );
            }
          }
        }

        // Świetlisty złoty środek w samym sercu róży
        for (let k = 0; k < 36; k++) {
          const a = k * GOLDEN;
          const r = scale * 0.14 * Math.sqrt(k / 36);
          const wf = toWorld(basis, ox, oy, oz, Math.cos(a) * r, scale * 0.22, Math.sin(a) * r);
          const wb = toWorld(basis, ox, oy, oz, Math.cos(a) * r * 0.4, scale * 0.12, Math.sin(a) * r * 0.4);
          pushVert(wb[0], wb[1], wb[2], wf[0], wf[1], wf[2], ax, ay, az, "goldCore", 0.86, delay, 0.9, true, 2);
        }
      }

      // 2. Kwiat 3D z rozchylonymi płatkami (Wiśnia / Kosmos 5-płatkowy lub Stokrotka / Słonecznik 9-płatkowy)
      function buildPetaled3D(ox, oy, oz, ax, ay, az, scale, petals, palName, centerPal, delay, sharp = false) {
        const basis = makeBasis(ax, ay, az);
        const nu = sharp ? 9 : 12;
        const nv = sharp ? 13 : 14;
        const rot0 = rand() * Math.PI * 2;

        function pLoc(u, v, phi, len, hw, tilt) {
          const profile = sharp
            ? Math.sin(Math.PI * Math.pow(v, 0.58)) * (1 - 0.35 * v)
            : Math.sin(Math.PI * Math.pow(v, 0.55)) * (1 + 0.12 * v);
          // Delikatne wcięcie końcówki płatka wiśni (sakura)
          const notch = !sharp && v > 0.82 ? 1 - 0.14 * Math.exp(-u * u * 10) * ((v - 0.82) / 0.18) : 1;
          const s = len * v * notch;
          const arch = tilt * (0.78 + 0.32 * v);
          const cup = (1 - u * u) * hw * 0.22 * Math.sin(Math.PI * v);
          const rad = scale * 0.18 + s * Math.sin(arch);
          const h = s * Math.cos(arch) - cup;
          const tang = u * hw * profile;
          const cp = Math.cos(phi);
          const sp = Math.sin(phi);
          return [rad * cp - tang * sp, h, rad * sp + tang * cp];
        }

        const len = scale * (sharp ? 0.98 : 0.92);
        const hw = scale * (sharp ? 0.24 : 0.42);
        const openTilt = sharp ? 1.24 : 1.06;
        const budTilt = 0.14;
        const eps = 0.04;

        for (let p = 0; p < petals; p++) {
          const phi = rot0 + (p * Math.PI * 2) / petals;
          const pDelay = delay + (p / petals) * 0.28;
          for (let iv = 1; iv <= nv; iv++) {
            const v = iv / nv;
            for (let iu = 0; iu < nu; iu++) {
              const u = -1 + (2 * iu) / (nu - 1);
              const fL = pLoc(u, v, phi, len, hw, openTilt);
              const bL = pLoc(u, v, phi, len * 0.52, hw * 0.45, budTilt);

              const fU = pLoc(u + eps, v, phi, len, hw, openTilt);
              const fV = pLoc(u, Math.min(1, v + eps), phi, len, hw, openTilt);
              const dux = fU[0] - fL[0], duy = fU[1] - fL[1], duz = fU[2] - fL[2];
              const dvx = fV[0] - fL[0], dvy = fV[1] - fL[1], dvz = fV[2] - fL[2];
              const lnx = duy * dvz - duz * dvy;
              const lny = duz * dvx - dux * dvz;
              const lnz = dux * dvy - duy * dvx;

              const wf = toWorld(basis, ox, oy, oz, fL[0], fL[1], fL[2]);
              const wb = toWorld(basis, ox, oy, oz, bL[0], bL[1], bL[2]);
              const wn = dirToWorld(basis, lnx, lny, lnz);

              const baseShade = clamp(0.26 + 0.62 * Math.pow(v, 0.9) + (1 - Math.abs(u)) * 0.14, 0.18, 1.0);
              pushVert(wb[0], wb[1], wb[2], wf[0], wf[1], wf[2], wn[0], wn[1], wn[2], palName, baseShade, pDelay, 1.25, v > 0.42, 1);
            }
          }
        }

        // Półkulisty świecący środek kwiatu (pyłek 3D)
        const GOLDEN = 2.399963229728653;
        const cPts = 52;
        const cr = scale * (sharp ? 0.30 : 0.24);
        for (let k = 0; k < cPts; k++) {
          const frac = (k + 0.5) / cPts;
          const r = cr * Math.sqrt(frac);
          const phi = k * GOLDEN;
          const h = cr * 0.62 * Math.sqrt(Math.max(0, 1 - frac));
          const wf = toWorld(basis, ox, oy, oz, Math.cos(phi) * r, h, Math.sin(phi) * r);
          const wb = toWorld(basis, ox, oy, oz, Math.cos(phi) * r * 0.4, h * 0.4, Math.sin(phi) * r * 0.4);
          const wn = dirToWorld(basis, Math.cos(phi) * r, h + 0.15, Math.sin(phi) * r);
          pushVert(wb[0], wb[1], wb[2], wf[0], wf[1], wf[2], wn[0], wn[1], wn[2], centerPal, 0.55 + 0.45 * (1 - frac), delay, 0.95, true, 2);
        }
      }

      // 3. Przestrzenny kłos lawendy / chabra 3D
      function buildLavender3D(bx, by, bz, tx, ty, tz, palName, delay) {
        const dx = tx - bx, dy = ty - by, dz = tz - bz;
        const basis = makeBasis(dx, dy, dz);
        const len = Math.hypot(dx, dy, dz);
        const GOLDEN = 2.399963229728653;
        const florets = 140;

        for (let k = 0; k < florets; k++) {
          const u = k / (florets - 1); // 0=nasada kłosa, 1=czubek
          const phi = k * GOLDEN;
          const rad = (0.14 + 0.26 * Math.sin(u * Math.PI)) * (0.7 + 0.3 * rand());
          const ly = u * len;
          const lx = Math.cos(phi) * rad;
          const lz = Math.sin(phi) * rad;

          const wf = toWorld(basis, bx, by, bz, lx, ly, lz);
          const wb = toWorld(basis, bx, by, bz, lx * 0.2, ly * 0.15, lz * 0.2);
          const wn = dirToWorld(basis, lx, 0.18, lz);
          const shade = clamp(0.32 + 0.52 * u + 0.18 * (rad / 0.4), 0.2, 1.0);
          pushVert(wb[0], wb[1], wb[2], wf[0], wf[1], wf[2], wn[0], wn[1], wn[2], palName, shade, delay + u * 0.45, 1.1, u > 0.35, 1);
        }
      }

      // 4. Krzywa łodyga 3D (rurka wzdłuż krzywej Béziera)
      function buildStem3D(x0, y0, z0, cx, cy, cz, x1, y1, z1, radius, delay, steps = 44) {
        const ring = 4;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const inv = 1 - u;
          const px = inv * inv * x0 + 2 * inv * u * cx + u * u * x1;
          const py = inv * inv * y0 + 2 * inv * u * cy + u * u * y1;
          const pz = inv * inv * z0 + 2 * inv * u * cz + u * u * z1;

          // Pozycja startowa przed wzrostem: u nasady wiązania
          const bx = lerp(x0, px, 0.08);
          const by = lerp(y0, py, 0.08);
          const bz = lerp(z0, pz, 0.08);

          const shade = 0.24 + 0.62 * u;
          for (let r = 0; r < ring; r++) {
            const a = (r * Math.PI * 2) / ring + u * 0.8;
            const ox = Math.cos(a) * radius;
            const oz = Math.sin(a) * radius;
            pushVert(
              bx, by, bz,
              px + ox, py, pz + oz,
              ox, 0.15, oz,
              "stemGreen",
              shade,
              delay * 0.35 + u * 0.55,
              0.75,
              false,
              0
            );
          }
        }
      }

      // 5. Wygięty liść 3D (eukaliptus / róża)
      function buildLeaf3D(ox, oy, oz, dx, dy, dz, length, width, delay) {
        const basis = makeBasis(dx, dy, dz);
        const nu = 7;
        const nv = 12;
        for (let iv = 1; iv <= nv; iv++) {
          const v = iv / nv;
          const w = width * Math.sin(Math.PI * Math.pow(v, 0.65));
          const droop = -0.34 * length * v * v;
          for (let iu = 0; iu < nu; iu++) {
            const u = -1 + (2 * iu) / (nu - 1);
            const lx = u * w;
            const ly = v * length;
            const lz = droop + (1 - Math.abs(u)) * 0.10 * width;

            const wf = toWorld(basis, ox, oy, oz, lx, ly, lz);
            const wb = toWorld(basis, ox, oy, oz, lx * 0.15, ly * 0.15, lz * 0.15);
            const wn = dirToWorld(basis, u * 0.35, 0.3, 0.88);
            const shade = clamp(0.28 + 0.45 * v + (1 - Math.abs(u)) * 0.25, 0.18, 0.95);
            pushVert(wb[0], wb[1], wb[2], wf[0], wf[1], wf[2], wn[0], wn[1], wn[2], "leafMint", shade, delay + v * 0.35, 0.95, v > 0.65, 0);
          }
        }
      }

      // 6. Plisowana, ażurowa złota owijka 3D + satynowa kokarda 3D
      function buildWrapAndBow3D() {
        const yTie = -2.25;
        const yTop = 0.35;

        // Złoty, plisowany stożek (wyrazisty i jedwabisty w 3D)
        const rings = 26;
        const segs = 76;
        for (let ir = 0; ir <= rings; ir++) {
          const v = ir / rings;
          const y = lerp(yTie, yTop, v);
          const baseR = lerp(0.56, 2.52, Math.pow(v, 0.90));
          for (let is = 0; is < segs; is++) {
            const onRim = ir >= rings - 2;
            const phi = (is * Math.PI * 2) / segs;
            const flute = Math.sin(phi * 10.0 + v * 1.4);
            // Gęstszy na górnej krawędzi i grzbietach plis, lekko ażurowy w zagłębieniach
            if (!onRim && flute < -0.25 && (ir + is) % 2 !== 0) continue;

            const r = baseR * (1.0 + 0.085 * v * flute);
            const x = Math.cos(phi) * r;
            const z = Math.sin(phi) * r;

            const nx = Math.cos(phi) - 0.28 * Math.sin(phi) * Math.cos(phi * 10);
            const nz = Math.sin(phi) + 0.28 * Math.cos(phi) * Math.cos(phi * 10);
            const shade = clamp(0.34 + 0.40 * v + 0.24 * (0.5 + 0.5 * flute) + (onRim ? 0.24 : 0), 0.26, 1.0);
            pushVert(
              x * 0.25, yTie, z * 0.25,
              x, y, z,
              nx, -0.30, nz,
              "wrapGold",
              shade,
              0.18 + v * 0.52,
              0.95,
              onRim || flute > 0.55,
              0
            );
          }
        }

        // Satynowa różowa opaska 360° wokół talii
        for (let iy = -3; iy <= 3; iy++) {
          const yy = yTie + iy * 0.075;
          const rr = 0.62 + (1 - Math.abs(iy) / 3.5) * 0.07;
          for (let is = 0; is < 64; is++) {
            const phi = (is * Math.PI * 2) / 64;
            const x = Math.cos(phi) * rr;
            const z = Math.sin(phi) * rr;
            pushVert(
              x * 0.4, yTie, z * 0.4,
              x, yy, z,
              Math.cos(phi), iy * 0.20, Math.sin(phi),
              "ribbonPink",
              0.74 + (1 - Math.abs(iy) / 3.5) * 0.26,
              0.65,
              0.85,
              true,
              1
            );
          }
        }

        // Przestrzenna, dwupętlowa kokarda 3D na froncie + dwie falujące wstążki 3D
        const bowZ = 0.70;
        for (const side of [-1, 1]) {
          for (let it = 0; it < 44; it++) {
            const a = (it / 43) * Math.PI * 2;
            const loopX = side * (0.68 + 0.66 * Math.cos(a));
            const loopY = yTie + 0.42 * Math.sin(a) * (0.72 + 0.28 * Math.cos(a));
            const loopZ = bowZ + 0.30 * Math.sin(a * 0.5) + 0.14 * (1 - Math.cos(a));
            for (let iw = -3; iw <= 3; iw++) {
              const wy = loopY + iw * 0.055;
              const wz = loopZ + Math.cos(a) * iw * 0.025;
              pushVert(
                0, yTie, bowZ * 0.5,
                loopX, wy, wz,
                side * 0.25, Math.sin(a) * 0.4 + iw * 0.12, 0.88,
                "ribbonPink",
                0.66 + 0.34 * (1 - Math.abs(iw) / 3.5),
                0.78,
                0.9,
                true,
                1
              );
            }
          }

          // Opadające wstążeczki 3D po obu stronach
          for (let ik = 0; ik < 34; ik++) {
            const u = ik / 33;
            const rx = side * (0.24 + u * 1.05 + Math.sin(u * 4.2) * 0.14);
            const ry = yTie - 0.12 - u * 1.72;
            const rz = bowZ + 0.16 + Math.sin(u * 3.5) * 0.26;
            for (let iw = -2; iw <= 2; iw++) {
              pushVert(
                0, yTie, bowZ * 0.5,
                rx + iw * 0.048, ry, rz,
                side * 0.2, 0.1, 0.95,
                "ribbonPink",
                0.88 - u * 0.32,
                0.88 + u * 0.25,
                0.8,
                u < 0.8,
                1
              );
            }
          }
        }
      }

      // =========================================================================
      // Złożenie całego przestrzennego bukietu 3D (symetryczna kopuła 360°!)
      // =========================================================================
      function buildFullBouquet3D() {
        const yTie = -2.25;
        const yBottom = -3.75;

        // Lista kwiatów 3D z wyraźniejszym oddechem między główkami (czytelne sylwetki w 360°!)
        const specs = [
          // Korona centralna: wielka królewska karmazynowa róża 3D
          { kind: "rose", x: 0.0, y: 2.95, z: 0.0, ax: 0.0, ay: 1.0, az: 0.05, scale: 1.28, pal: "crimsonRose", delay: 0.70, petals: 18 },

          // Pierścień górny (5 dużych, wyraźnych kwiatów co 72° wokół osi Y)
          ...Array.from({ length: 5 }, (_, k) => {
            const a = (k * Math.PI * 2) / 5 + 0.24;
            const r = 1.92;
            const types = [
              { kind: "rose", pal: "blushPeony", scale: 1.04, petals: 15 },
              { kind: "cosmos", pal: "sakura", center: "goldCore", scale: 1.05, petals: 5, sharp: false },
              { kind: "rose", pal: "coralRose", scale: 1.02, petals: 15 },
              { kind: "cosmos", pal: "sunflower", center: "crimsonRose", scale: 0.98, petals: 9, sharp: true },
              { kind: "rose", pal: "lavender", scale: 1.00, petals: 15 },
            ][k];
            return {
              ...types,
              x: Math.cos(a) * r,
              y: 1.92 + (k % 2) * 0.18,
              z: Math.sin(a) * r,
              ax: Math.cos(a) * 0.48,
              ay: 0.87,
              az: Math.sin(a) * 0.48,
              delay: 0.86 + k * 0.11,
            };
          }),

          // Pierścień dolny-zewnętrzny (6 wyraźnych, kontrastowych kwiatów co 60° pochylonych na zewnątrz)
          ...Array.from({ length: 6 }, (_, k) => {
            const a = (k * Math.PI * 2) / 6 + 0.62;
            const r = 2.74;
            const types = [
              { kind: "cosmos", pal: "creamPearl", center: "goldCore", scale: 0.94, petals: 8, sharp: true },
              { kind: "rose", pal: "crimsonRose", scale: 0.90, petals: 13 },
              { kind: "cosmos", pal: "sakura", center: "goldCore", scale: 0.96, petals: 5, sharp: false },
              { kind: "cosmos", pal: "sunflower", center: "crimsonRose", scale: 0.92, petals: 9, sharp: true },
              { kind: "rose", pal: "blushPeony", scale: 0.92, petals: 13 },
              { kind: "cosmos", pal: "cornflower", center: "goldCore", scale: 0.90, petals: 6, sharp: false },
            ][k];
            return {
              ...types,
              x: Math.cos(a) * r,
              y: 0.78 + (k % 2) * 0.22,
              z: Math.sin(a) * r,
              ax: Math.cos(a) * 0.74,
              ay: 0.67,
              az: Math.sin(a) * 0.74,
              delay: 1.10 + k * 0.09,
            };
          }),
        ];

        // Buduj każdy kwiat + jego przestrzenną łodygę 3D schodzącą przez kokardę aż w dół
        for (const sp of specs) {
          if (sp.kind === "rose") {
            buildRose3D(sp.x, sp.y, sp.z, sp.ax, sp.ay, sp.az, sp.scale, sp.pal, sp.delay, sp.petals);
          } else {
            buildPetaled3D(sp.x, sp.y, sp.z, sp.ax, sp.ay, sp.az, sp.scale, sp.petals, sp.pal, sp.center, sp.delay, sp.sharp);
          }

          // Łodyga od talii do główki kwiatu
          buildStem3D(
            sp.x * 0.14, yTie, sp.z * 0.14,
            sp.x * 0.45, lerp(yTie, sp.y, 0.48), sp.z * 0.45,
            sp.x * 0.94, sp.y - 0.12, sp.z * 0.94,
            0.055,
            sp.delay
          );

          // Dolna końcówka łodygi rozchodząca się lekko poniżej kokardy
          buildStem3D(
            sp.x * 0.14, yTie, sp.z * 0.14,
            sp.x * 0.22, lerp(yTie, yBottom, 0.5), sp.z * 0.22,
            sp.x * 0.34, yBottom - rand() * 0.25, sp.z * 0.34,
            0.05,
            0.35,
            16
          );
        }

        // 6 strzelistych kłosów lawendy i chabrów 3D wyłaniających się ponad koroną
        for (let k = 0; k < 6; k++) {
          const a = (k * Math.PI * 2) / 6 + 0.12;
          const rBase = 1.15;
          const rTip = 1.95;
          const pal = k % 2 === 0 ? "lavender" : "cornflower";
          const bx = Math.cos(a) * rBase, by = 1.85, bz = Math.sin(a) * rBase;
          const tx = Math.cos(a) * rTip, ty = 3.65 + (k % 2) * 0.22, tz = Math.sin(a) * rTip;
          buildLavender3D(bx, by, bz, tx, ty, tz, pal, 0.72 + k * 0.08);
          buildStem3D(bx * 0.18, yTie, bz * 0.18, bx * 0.55, 0.0, bz * 0.55, bx, by, bz, 0.045, 0.6, 28);
        }

        // 12 przestrzennie wygiętych liści eukaliptusa tworzących kołnierz u dołu korony
        for (let k = 0; k < 12; k++) {
          const a = (k * Math.PI * 2) / 12 + 0.26;
          const r0 = 1.85;
          const ox = Math.cos(a) * r0;
          const oy = 0.22 + (k % 2) * 0.24;
          const oz = Math.sin(a) * r0;
          buildLeaf3D(ox, oy, oz, Math.cos(a) * 0.92, 0.32, Math.sin(a) * 0.92, 1.38, 0.42, 0.52 + k * 0.04);
        }

        // Delikatna chmurka 3D świetlistej gipsówki (Baby's Breath) pomiędzy kwiatami
        for (let k = 0; k < 78; k++) {
          const a = rand() * Math.PI * 2;
          const elev = lerp(0.15, 1.35, rand());
          const rad = lerp(1.5, 3.05, Math.sqrt(rand())) * Math.sin(elev);
          const fx = Math.cos(a) * rad;
          const fy = 0.85 + Math.cos(elev) * 2.15 + rand() * 0.5;
          const fz = Math.sin(a) * rad;
          const pal = rand() < 0.35 ? "goldCore" : "creamPearl";
          pushVert(fx * 0.3, yTie, fz * 0.3, fx, fy, fz, fx, fy, fz, pal, 0.92, 1.45 + rand() * 0.8, 0.85, true, 2);
        }

        // Plisowana złota owijka 3D + satynowa różowa kokarda 3D
        buildWrapAndBow3D();
      }

      buildFullBouquet3D();

      // =========================================================================
      // Orbitujące cząsteczki 3D (płatki, świetliki i serduszka krążące w 360°!)
      // =========================================================================
      const orbiters = [];
      for (let i = 0; i < 42; i++) {
        const isHeart = i < 12;
        const isPetal = !isHeart && i < 26;
        orbiters.push({
          kind: isHeart ? "heart" : isPetal ? "petal" : "spark",
          radius: isHeart ? lerp(3.4, 4.7, rand()) : lerp(2.8, 4.8, rand()),
          angle: rand() * Math.PI * 2,
          speed: (0.16 + rand() * 0.28) * (rand() < 0.5 ? 1 : -1),
          yBase: lerp(-2.6, 3.6, rand()),
          yAmp: 0.25 + rand() * 0.55,
          phase: rand() * Math.PI * 2,
          appear: 1.7 + rand() * 2.4,
          pal: isHeart ? PAL_ID.ribbonPink : isPetal ? (rand() < 0.5 ? PAL_ID.blushPeony : PAL_ID.sakura) : PAL_ID.goldCore,
          shade: Math.floor(lerp(PAL_STEPS * 0.62, PAL_STEPS - 1, rand())),
        });
      }

      // Jednorazowe płatki/serduszka z kliknięcia w ekran
      const bursts = [];
      function spawnClickBurst(wx, wy, wz) {
        for (let i = 0; i < 14; i++) {
          if (bursts.length > 90) break;
          const a = rand() * Math.PI * 2;
          const sp = 1.2 + rand() * 3.0;
          bursts.push({
            kind: i < 5 ? "heart" : i < 11 ? "petal" : "spark",
            x: wx,
            y: wy,
            z: wz,
            vx: Math.cos(a) * sp,
            vy: 0.8 + rand() * 2.4,
            vz: Math.sin(a) * sp,
            age: 0,
            life: 2.2 + rand() * 1.6,
            pal: i < 5 ? PAL_ID.ribbonPink : i < 11 ? PAL_ID.sakura : PAL_ID.goldCore,
          });
        }
      }

      // Subtelne statyczne gwiazdki w głębokim tle
      const bgStars = Array.from({ length: 56 }, () => ({
        u: rand(),
        v: rand() * 0.86,
        phase: rand() * Math.PI * 2,
        speed: 0.8 + rand() * 1.5,
      }));

      // =========================================================================
      // Stan kamery 3D, interaktywne obracanie i efekt rozproszenia w pył
      // =========================================================================
      let simTime = FORCE_TIME !== null && Number.isFinite(FORCE_TIME) ? FORCE_TIME : 0;
      let yaw = FORCE_YAW !== null && Number.isFinite(FORCE_YAW) ? FORCE_YAW : 0.22;
      let pitch = 0.35; // widok lekko z góry, eksponujący rozkwitłe spirale róż i głębię 3D!
      let yawVel = 0;
      let pitchVel = 0;
      let dragging = false;
      let lastPtrX = 0;
      let lastPtrY = 0;
      let dragDist = 0;

      // Opcjonalny efekt „pył” (rozproszenie jak finał bloom3d.py i powrót do bukietu)
      let disperseTimer = -1;
      const DISPERSE_DURATION = 5.4;

      let layout = { dpr: 1, w: 1280, h: 800, isMobile: false, fontSize: 10, cellW: 6, cellH: 10, offsetX: 0, offsetY: 0 };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;
        const isMobile = w < 680;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;

        crispCanvas.width = canvas.width;
        crispCanvas.height = canvas.height;

        const glowScale = 0.48;
        glowCanvas.width = Math.max(1, Math.round(w * dpr * glowScale));
        glowCanvas.height = Math.max(1, Math.round(h * dpr * glowScale));

        // Dopasowanie gęstości siatki do ekranu (ultra-gęsty hologram na PC, ostry i wyraźny na telefonie)
        const targetCellH = isMobile ? clamp(w / 52, 7.2, 9.4) : clamp(h / 78, 9.5, 13.0);
        const cellH = targetCellH;
        const cellW = cellH * CELL_RATIO;
        const cols = Math.max(66, Math.min(180, Math.floor((w - 12) / cellW)));
        const rows = Math.max(52, Math.min(104, Math.floor((h - 14) / cellH)));

        if (cols !== COLS || rows !== ROWS) {
          allocGrid(cols, rows);
        }

        const gridW = cols * cellW;
        const gridH = rows * cellH;
        layout = {
          dpr,
          w,
          h,
          isMobile,
          fontSize: cellH * 1.05,
          cellW,
          cellH,
          offsetX: (w - gridW) * 0.5,
          offsetY: (h - gridH) * 0.5,
        };

        render3D(simTime);
        paintFrame();
      }

      // =========================================================================
      // Główny potok renderowania 3D -> Z-buffer ASCII + Oświetlenie Blinn-Phong
      // =========================================================================
      function render3D(t) {
        const n = COLS * ROWS;
        bufChar.fill(" ");
        bufZ.fill(0);
        bufGlow.fill(0);

        // 1. Subtelne gwiazdy w tle
        const starColBase = PAL_ID.creamPearl * PAL_STEPS;
        for (const st of bgStars) {
          const tw = 0.5 + 0.5 * Math.sin(t * st.speed + st.phase);
          if (tw > 0.42) {
            const c = Math.floor(st.u * COLS);
            const r = Math.floor(st.v * ROWS);
            const idx = r * COLS + c;
            bufChar[idx] = tw > 0.88 ? "+" : ".";
            bufColIdx[idx] = starColBase + Math.floor(5 + tw * 14);
            bufZ[idx] = 0.001;
            bufGlow[idx] = tw > 0.85 ? 1 : 0;
          }
        }

        // Postęp rozproszenia w pył (0 = pełny bukiet, 1 = chmura gwiezdna)
        let disperseAmt = 0;
        if (disperseTimer >= 0) {
          const p = disperseTimer / DISPERSE_DURATION;
          if (p < 0.45) {
            disperseAmt = smoothstep(0, 0.45, p);
          } else if (p < 0.58) {
            disperseAmt = 1.0;
          } else {
            disperseAmt = 1.0 - smoothstep(0.58, 1.0, p);
          }
        }

        // Macierz obrotu 3D (Yaw wokół Y, potem Pitch wokół X)
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);

        // R = Rx(pitch) * Ry(yaw)
        const m00 = cy,        m01 = 0,   m02 = sy;
        const m10 = sp * sy,   m11 = cp,  m12 = -sp * cy;
        const m20 = -cp * sy,  m21 = sp,  m22 = cp * cy;

        // Dwa źródła światła: główne kluczowe (góra-lewo-przód) + ciepłe konturowe (prawo-tył)
        const lx1 = -0.45, ly1 = 0.68, lz1 = 0.58;
        const lx2 =  0.66, ly2 = 0.34, lz2 = -0.67;
        // Wektor połówkowy Blinna-Phonga (widok = (0, 0, 1))
        let hx = lx1, hy = ly1, hz = lz1 + 1.0;
        const hl = Math.hypot(hx, hy, hz);
        hx /= hl; hy /= hl; hz /= hl;

        // Parametry kamery i kadrowania (dopasowane pod pełny, bujny 3D bukiet + dedykacja u dołu)
        const camDist = 11.8;
        const usableH = ROWS * 0.86;
        const baseDim = Math.min(COLS * CELL_RATIO * 0.90, usableH);
        const scaleY = baseDim * 1.10;
        const scaleX = scaleY / CELL_RATIO;
        const cx = COLS * 0.5;
        const cyScreen = ROWS * (layout.isMobile ? 0.45 : 0.465);

        // Delikatny, naturalny oddech bukietu
        const breathe = Math.sin(t * 1.25) * 0.035;
        const globalRise = smoothstep(0.0, 0.55, t);

        // Pętla po wszystkich ~27k punktach 3D (cache-friendly, bez alokacji obiektów!)
        for (let i = 0; i < vertCount; i++) {
          const delay = vDelay[i];
          if (t < delay) continue;

          const rawProg = (t - delay) / vDur[i];
          const prog = rawProg >= 1 ? 1 : vKind[i] === 1 ? easeOutBack(rawProg) : easeOutCubic(rawProg);

          let x = vBx[i] + (vFx[i] - vBx[i]) * prog;
          let y = vBy[i] + (vFy[i] - vBy[i]) * prog;
          let z = vBz[i] + (vFz[i] - vBz[i]) * prog;

          // Delikatne kołysanie korony na wietrze (większe u góry bukietu)
          const hNorm = y > -2.2 ? (y + 2.2) * 0.16 : 0;
          x += breathe * hNorm * hNorm * Math.cos(t * 1.1 + z * 0.7);
          z += breathe * hNorm * hNorm * Math.sin(t * 0.9 + x * 0.7);

          // Opcjonalne rozproszenie w wirującą galaktykę cząsteczek 3D!
          if (disperseAmt > 0.001) {
            const swirl = disperseAmt * 2.2;
            const cs = Math.cos(swirl), ss = Math.sin(swirl);
            const dx = vDx[i] * disperseAmt;
            const dy = vDy[i] * disperseAmt;
            const dz = vDz[i] * disperseAmt;
            x = (x + dx) * cs - (z + dz) * ss;
            z = (x + dx) * ss + (z + dz) * cs;
            y += dy;
          }

          // Skalowanie wejściowe z iskierki światła w pierwszych 0.55 s
          if (globalRise < 0.999) {
            const s0 = 0.15 + 0.85 * globalRise;
            x *= s0;
            y = lerp(-0.5, y, s0);
            z *= s0;
          }

          // Obrót 3D + rzut perspektywiczny
          const rz = m20 * x + m21 * y + m22 * z;
          const dzCam = camDist - rz;
          if (dzCam <= 1.2) continue;
          const invZ = 1.0 / dzCam;

          const rx = m00 * x + m01 * y + m02 * z;
          const ry = m10 * x + m11 * y + m12 * z;

          const sx = (cx + rx * scaleX * invZ) | 0;
          if (sx < 0 || sx >= COLS) continue;
          const sy = (cyScreen - ry * scaleY * invZ) | 0;
          if (sy < 0 || sy >= ROWS - 6) continue;

          const idx = sy * COLS + sx;
          if (invZ <= bufZ[idx]) continue;
          bufZ[idx] = invZ;

          // Obrót normalnej 3D + dwustronne oświetlenie płatków (żeby tył płatków też pięknie świecił!)
          let nx = m00 * vNx[i] + m01 * vNy[i] + m02 * vNz[i];
          let ny = m10 * vNx[i] + m11 * vNy[i] + m12 * vNz[i];
          let nz = m20 * vNx[i] + m21 * vNy[i] + m22 * vNz[i];
          let backTint = 1.0;
          if (nz < 0) {
            nx = -nx;
            ny = -ny;
            nz = -nz;
            backTint = 0.84;
          }

          let diff1 = nx * lx1 + ny * ly1 + nz * lz1;
          if (diff1 < 0) diff1 = 0;
          let diff2 = nx * lx2 + ny * ly2 + nz * lz2;
          if (diff2 < 0) diff2 = 0;

          const spDot = nx * hx + ny * hy + nz * hz;
          const spec = spDot > 0 ? Math.pow(spDot, 10) * 0.55 : 0;

          // Efekt Fresnela (świetlista krawędź na wygiętych płatkach 3D!)
          const rim = (1.0 - nz) * (1.0 - nz) * 0.34;

          // Perspektywa głębi + mocne, świetliste oświetlenie holograficzne 3D
          const depthCue = clamp((invZ - 0.064) * 26.0, 0.48, 1.15);

          const base = vBaseShade[i];
          let lum = (0.24 + 0.58 * diff1 + 0.28 * diff2 + spec + rim) * (0.46 + 0.54 * base) * backTint * depthCue;
          if (disperseAmt > 0.05) lum = Math.min(1.0, lum + disperseAmt * 0.25);
          lum = clamp(lum, 0.12, 1.0);

          const cIdx = Math.min(RAMP_MAX, Math.max(1, (lum * RAMP_MAX + 0.5) | 0));
          bufChar[idx] = RAMP[cIdx];

          const palT = clamp(base * 0.54 + lum * 0.50 + spec * 0.32, 0.10, 0.999);
          bufColIdx[idx] = vPal[i] * PAL_STEPS + ((palT * (PAL_STEPS - 1)) | 0);
          bufGlow[idx] = (vGlowFlag[i] && lum > 0.36) || spec > 0.14 || disperseAmt > 0.25 ? 1 : 0;
        }

        // 2. Orbitujące cząsteczki 3D (przelatują zarówno PRZED jak i ZA bukietem dzięki Z-buforowi!)
        for (const o of orbiters) {
          if (t < o.appear) continue;
          const fade = smoothstep(o.appear, o.appear + 1.1, t);
          const ang = o.angle + t * o.speed;
          const ox = Math.cos(ang) * o.radius;
          const oy = o.yBase + Math.sin(t * 1.3 + o.phase) * o.yAmp;
          const oz = Math.sin(ang) * o.radius;

          const rz = m20 * ox + m21 * oy + m22 * oz;
          const dzCam = camDist - rz;
          if (dzCam <= 1.2) continue;
          const invZ = 1.0 / dzCam;
          const rx = m00 * ox + m01 * oy + m02 * oz;
          const ry = m10 * ox + m11 * oy + m12 * oz;

          const sx = (cx + rx * scaleX * invZ) | 0;
          const sy = (cyScreen - ry * scaleY * invZ) | 0;
          if (sx < 2 || sx >= COLS - 2 || sy < 2 || sy >= ROWS - 8) continue;

          const idx = sy * COLS + sx;
          if (invZ <= bufZ[idx]) continue;

          const pulse = 0.5 + 0.5 * Math.sin(t * 3.1 + o.phase);
          const shade = clamp(Math.floor(o.shade * (0.65 + 0.35 * pulse) * fade), 4, PAL_STEPS - 1);
          const colIdx = o.pal * PAL_STEPS + shade;

          if (o.kind === "heart") {
            bufZ[idx] = invZ;
            bufChar[idx] = "<";
            bufColIdx[idx] = colIdx;
            bufGlow[idx] = 1;
            const idx2 = idx + 1;
            if (invZ > bufZ[idx2]) {
              bufZ[idx2] = invZ;
              bufChar[idx2] = "3";
              bufColIdx[idx2] = colIdx;
              bufGlow[idx2] = 1;
            }
          } else if (o.kind === "petal") {
            bufZ[idx] = invZ;
            bufChar[idx] = pulse > 0.5 ? "~" : "*";
            bufColIdx[idx] = colIdx;
            bufGlow[idx] = 1;
          } else {
            bufZ[idx] = invZ;
            bufChar[idx] = pulse > 0.62 ? "+" : "·";
            bufColIdx[idx] = colIdx;
            bufGlow[idx] = pulse > 0.5 ? 1 : 0;
          }
        }

        // 3. Cząsteczki po kliknięciu
        for (const b of bursts) {
          const fade = 1 - smoothstep(b.life * 0.55, b.life, b.age);
          if (fade <= 0.05) continue;
          const rz = m20 * b.x + m21 * b.y + m22 * b.z;
          const dzCam = camDist - rz;
          if (dzCam <= 1.2) continue;
          const invZ = 1.0 / dzCam;
          const rx = m00 * b.x + m01 * b.y + m02 * b.z;
          const ry = m10 * b.x + m11 * b.y + m12 * b.z;

          const sx = (cx + rx * scaleX * invZ) | 0;
          const sy = (cyScreen - ry * scaleY * invZ) | 0;
          if (sx < 1 || sx >= COLS - 2 || sy < 1 || sy >= ROWS - 7) continue;

          const idx = sy * COLS + sx;
          if (invZ <= bufZ[idx]) continue;
          const colIdx = b.pal * PAL_STEPS + clamp(Math.floor((0.45 + 0.55 * fade) * (PAL_STEPS - 1)), 4, PAL_STEPS - 1);
          if (b.kind === "heart") {
            bufZ[idx] = invZ; bufChar[idx] = "<"; bufColIdx[idx] = colIdx; bufGlow[idx] = 1;
            bufZ[idx + 1] = invZ; bufChar[idx + 1] = "3"; bufColIdx[idx + 1] = colIdx; bufGlow[idx + 1] = 1;
          } else {
            bufZ[idx] = invZ; bufChar[idx] = b.kind === "petal" ? "*" : "+"; bufColIdx[idx] = colIdx; bufGlow[idx] = 1;
          }
        }
      }

      // =========================================================================
      // Dedykacja u dołu („Dla Kochanej Wiktorii <3”) — świecąca i super czytelna
      // =========================================================================
      function drawDedicationOverlay(targetCtx, t, isGlowLayer) {
        const textStart = 2.15;
        const typeProg = clamp((t - textStart) / 1.8, 0, 1);
        if (typeProg <= 0) return;

        const { w, h, isMobile } = layout;
        const cx = w * 0.5;
        const sepY = h - (isMobile ? 96 : 86);
        const textY = h - (isMobile ? 64 : 52);
        const subY = h - (isMobile ? 40 : 28);

        const sepSize = clamp(isMobile ? w * 0.030 : 13, 11, 15);
        const titleSize = clamp(isMobile ? w * 0.048 : Math.min(w * 0.022, 26), 16, 26);

        targetCtx.textAlign = "center";
        targetCtx.textBaseline = "middle";

        const sepReveal = smoothstep(textStart - 0.25, textStart + 0.75, t);
        if (sepReveal > 0.1) {
          targetCtx.font = `500 ${sepSize.toFixed(1)}px ${FONT_STACK}`;
          targetCtx.save();
          targetCtx.globalAlpha = sepReveal * (isGlowLayer ? 0.85 : 0.95);
          targetCtx.fillStyle = "#c97ca0";
          targetCtx.fillText("· · ─ ─     ─ ─ · ·", cx, sepY);
          targetCtx.fillStyle = "#ffe59c";
          targetCtx.fillText("✦", cx, sepY);
          targetCtx.restore();
        }

        const fullText = DEDICATION;
        const shownCount = Math.floor(fullText.length * typeProg + 0.001);
        const shown = fullText.slice(0, shownCount);
        const done = typeProg >= 1;

        targetCtx.font = `600 ${titleSize.toFixed(1)}px ${FONT_STACK}`;

        const grad = targetCtx.createLinearGradient(cx - titleSize * 7, textY, cx + titleSize * 7, textY);
        const shift = 0.5 + 0.5 * Math.sin(t * 1.8);
        grad.addColorStop(0, mixColorStr([255, 170, 208], [255, 224, 198], shift));
        grad.addColorStop(0.5, "#fff5fa");
        grad.addColorStop(1, mixColorStr([255, 224, 198], [255, 170, 208], shift));

        const cursor = !done && Math.floor(t * 6) % 2 === 0 ? "_" : "";
        const displayMain = done ? `${fullText}   ` : `${shown}${cursor}`;
        targetCtx.fillStyle = grad;
        targetCtx.fillText(displayMain, cx, textY);

        if (done) {
          const metrics = targetCtx.measureText(fullText);
          const heartX = cx + metrics.width * 0.5 + titleSize * 0.78;
          const pulse = 0.5 + 0.5 * Math.sin(t * 4.2);
          targetCtx.fillStyle = mixColorStr([255, 78, 144], [255, 206, 228], pulse);
          targetCtx.fillText("<3", heartX, textY);

          const subFade = smoothstep(textStart + 1.8, textStart + 2.7, t);
          if (subFade > 0.1 && !isGlowLayer) {
            targetCtx.save();
            targetCtx.globalAlpha = 0.45 * subFade;
            targetCtx.font = `400 ${Math.max(10, sepSize * 0.85).toFixed(1)}px ${FONT_STACK}`;
            targetCtx.fillStyle = "#ffc4df";
            targetCtx.fillText("·  ·  ·", cx, subY);
            targetCtx.restore();
          }
        }
      }

      // =========================================================================
      // Dwuwarstwowy render na Canvas: krystaliczne znaki + filmowa poświata bloom
      // =========================================================================
      function paintFrame() {
        const { dpr, w, h, fontSize, cellW, cellH, offsetX, offsetY } = layout;

        crispCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        crispCtx.clearRect(0, 0, w, h);
        crispCtx.font = `600 ${fontSize.toFixed(2)}px ${FONT_STACK}`;
        crispCtx.textAlign = "center";
        crispCtx.textBaseline = "middle";

        const gs = glowCanvas.width / w;
        glowCtx.setTransform(gs, 0, 0, gs, 0, 0);
        glowCtx.clearRect(0, 0, w, h);
        glowCtx.font = crispCtx.font;
        glowCtx.textAlign = "center";
        glowCtx.textBaseline = "middle";

        let lastCrispCol = -1;
        let lastGlowCol = -1;

        for (let r = 0; r < ROWS; r++) {
          const py = offsetY + (r + 0.5) * cellH;
          const rowOff = r * COLS;
          for (let c = 0; c < COLS; c++) {
            const idx = rowOff + c;
            const ch = bufChar[idx];
            if (ch === " ") continue;
            const colIdx = bufColIdx[idx];
            const px = offsetX + (c + 0.5) * cellW;

            if (colIdx !== lastCrispCol) {
              crispCtx.fillStyle = COLOR_LUT[colIdx];
              lastCrispCol = colIdx;
            }
            crispCtx.fillText(ch, px, py);

            if (bufGlow[idx]) {
              if (colIdx !== lastGlowCol) {
                glowCtx.fillStyle = COLOR_LUT[colIdx];
                lastGlowCol = colIdx;
              }
              glowCtx.fillText(ch, px, py);
            }
          }
        }

        drawDedicationOverlay(crispCtx, simTime, false);
        drawDedicationOverlay(glowCtx, simTime, true);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        // Filmowy dwupasmowy bloom (jak w bloom3d.py z addytywnym mieszaniem)
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.52;
        ctx.filter = "blur(11px)";
        ctx.drawImage(glowCanvas, 0, 0, w, h);

        ctx.globalAlpha = 0.66;
        ctx.filter = "blur(3.2px)";
        ctx.drawImage(glowCanvas, 0, 0, w, h);
        ctx.restore();

        ctx.drawImage(crispCanvas, 0, 0, w, h);
      }

      // =========================================================================
      // Interakcja 3D (obrót myszką/palcem z bezwładnością + kliknięcie)
      // =========================================================================
      canvas.addEventListener("pointerdown", (e) => {
        dragging = true;
        dragDist = 0;
        lastPtrX = e.clientX;
        lastPtrY = e.clientY;
        canvas.classList.add("dragging");
        canvas.setPointerCapture(e.pointerId);
        const hint = document.getElementById("hint");
        if (hint) hint.style.opacity = "0";
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastPtrX;
        const dy = e.clientY - lastPtrY;
        dragDist += Math.hypot(dx, dy);
        lastPtrX = e.clientX;
        lastPtrY = e.clientY;

        yaw += dx * 0.0085;
        pitch = clamp(pitch + dy * 0.006, -0.45, 0.85);
        yawVel = dx * 0.0055;
        pitchVel = dy * 0.003;
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        canvas.classList.remove("dragging");
        if (dragDist < 8) {
          // Krótkie kliknięcie/dotknięcie uwalnia chmurę płatków i <3 w 3D
          spawnClickBurst((rand() - 0.5) * 1.4, 1.4 + rand() * 0.8, (rand() - 0.5) * 1.4);
        }
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }

      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      document.getElementById("replayBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        simTime = 0;
        disperseTimer = -1;
        yaw = 0.22;
        pitch = 0.35;
      });

      document.getElementById("disperseBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        if (disperseTimer < 0) disperseTimer = 0;
      });

      window.addEventListener("resize", resize);
      resize();

      let lastTs = performance.now();
      function tick(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
        lastTs = now;

        if (FORCE_TIME !== null && Number.isFinite(FORCE_TIME)) {
          simTime = FORCE_TIME;
          if (FORCE_YAW !== null && Number.isFinite(FORCE_YAW)) yaw = FORCE_YAW;
          render3D(simTime);
          paintFrame();
          return;
        }

        simTime += dt;

        // Płynny, hipnotyczny obrót 360° + wygaszanie bezwładności po przeciągnięciu
        if (!dragging) {
          yaw += (0.42 + yawVel * 8.0) * dt;
          yawVel *= Math.pow(0.06, dt);
          pitch += pitchVel * 6.0 * dt;
          pitchVel *= Math.pow(0.05, dt);
          // Łagodny powrót pochylenia do optymalnego widoku kopuły 3D
          const targetPitch = 0.35 + Math.sin(simTime * 0.55) * 0.08;
          pitch += (targetPitch - pitch) * Math.min(1, dt * 1.1);
        }

        if (disperseTimer >= 0) {
          disperseTimer += dt;
          if (disperseTimer >= DISPERSE_DURATION) {
            disperseTimer = -1;
          }
        }

        // Aktualizacja cząsteczek po kliknięciu
        for (let i = bursts.length - 1; i >= 0; i--) {
          const b = bursts[i];
          b.age += dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.z += b.vz * dt;
          b.vx *= 0.98;
          b.vz *= 0.98;
          b.vy -= 0.45 * dt;
          if (b.age >= b.life) bursts.splice(i, 1);
        }

        render3D(simTime);
        paintFrame();
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
